<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevToolsHub - Ferramentas para Desenvolvedores</title>
    <style>
        /* Configuração de Cores Solicitada pelo Usuário */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8F9FA; /* ⬜ Fundo: Cinza Conforto */
            color: #2C3E50; /* ⬛ Textos: Grafite Suave */
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Barra Lateral de Navegação */
        aside {
            width: 260px;
            background-color: #1A73E8; /* 🟦 Estrutura/Marca: Azul Tecnológico */
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        aside h2 {
            color: #FFFFFF;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-link {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-link.active {
            background-color: #FFFFFF;
            color: #1A73E8; /* 🟦 Azul Tecnológico */
            font-weight: bold;
        }
        .nav-link:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
        }

        /* Área de Conteúdo Principal */
        main {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            max-width: 800px;
        }
        h1 {
            color: #2C3E50; /* ⬛ Grafite Suave */
            margin-top: 0;
        }
        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        /* Caixa da Ferramenta */
        .card {
            background-color: #FFFFFF; /* ⬜ Fundo Branco */
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #F8F9FA;
            border: 2px solid #E2E8F0;
            color: #2C3E50;
            padding: 15px;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #1A73E8; /* 🟦 Foco em Azul Tecnológico */
        }

        /* Painel de Estatísticas (Contador) */
        .stats-container {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        .stat-box {
            background-color: #F8F9FA;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #E2E8F0;
            flex: 1;
            text-align: center;
        }
        .stat-box span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1A73E8; /* 🟦 Números em Azul Tecnológico */
        }
        .stat-box label {
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        /* Botões de Ação */
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        button {
            background-color: #F39C12; /* 🟧 Botão de Ação: Laranja Chamativo */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #E67E22; /* Laranja um pouco mais escuro no hover */
        }
        button.btn-clear {
            margin-left: auto; 
            background-color: #BDC3C7; 
            color: #2C3E50;
        }
        button.btn-clear:hover {
            background-color: #95A5A6;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral com Identidade Visual Azul -->
    <aside>
        <h2>🛠️ DevToolsHub</h2>
        <a href="#" class="nav-link active">Modificador de Texto</a>
        <a href="#" class="nav-link" style="opacity: 0.4; pointer-events: none;">Em breve...</a>
    </aside>

    <!-- Conteúdo Principal -->
    <main>
        <h1>Modificador de Texto & Contador</h1>
        <p class="subtitle">Formate seus textos e veja estatísticas em tempo real.</p>

        <div class="card">
            <textarea id="textoInput" placeholder="Cole ou digite seu texto aqui..." oninput="atualizarContadores()"></textarea>
            
            <!-- Contadores dinâmicos -->
            <div class="stats-container">
                <div class="stat-box">
                    <span id="charCount">0</span>
                    <label>Caracteres</label>
                </div>
                <div class="stat-box">
                    <span id="wordCount">0</span>
                    <label>Palavras</label>
                </div>
            </div>
            
            <div class="buttons">
                <button onclick="transformarMaiusculo()">MAIÚSCULO</button>
                <button onclick="transformarMinusculo()">minúsculo</button>
                <button onclick="limparTexto()" class="btn-clear">Limpar</button>
            </div>
        </div>
    </main>

    <script>
        const campo = document.getElementById("textoInput");
        const charCount = document.getElementById("charCount");
        const wordCount = document.getElementById("wordCount");

        function atualizarContadores() {
            let texto = campo.value;
            charCount.textContent = texto.length;
            let palavras = texto.trim().split(/\s+/).filter(item => item.length > 0);
            wordCount.textContent = palavras.length;
        }

        function transformarMaiusculo() {
            campo.value = campo.value.toUpperCase();
            atualizarContadores();
        }

        function transformarMinusculo() {
            campo.value = campo.value.toLowerCase();
            atualizarContadores();
        }

        function limparTexto() {
            campo.value = "";
            atualizarContadores();
        }
    </script>

</body>
</html>
