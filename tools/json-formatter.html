<body>

<header>
    <a href="../index.html">devtools</a>

<main>

```
<h1>JSON Formatter</h1>

<p class="description">
    Format, validate and minify JSON directly in your browser.
</p>

<textarea id="input" placeholder='Paste your JSON here...
```

Example:
{"name":"devtools","active":true}'></textarea>

```
<div class="buttons">
    <button onclick="formatJSON()">Format</button>
    <button onclick="minifyJSON()">Minify</button>
    <button class="secondary" onclick="clearJSON()">Clear</button>
</div>

<div id="error" class="error"></div>

<pre id="output"></pre>
```

</main>

<script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const error = document.getElementById("error");

    function formatJSON() {
        error.textContent = "";

        try {
            const json = JSON.parse(input.value);

            output.textContent = JSON.stringify(json, null, 4);
            output.style.display = "block";
        } catch (e) {
            output.style.display = "none";
            error.textContent = "Invalid JSON: " + e.message;
        }
    }

    function minifyJSON() {
        error.textContent = "";

        try {
            const json = JSON.parse(input.value);

            output.textContent = JSON.stringify(json);
            output.style.display = "block";
        } catch (e) {
            output.style.display = "none";
            error.textContent = "Invalid JSON: " + e.message;
        }
    }

    function clearJSON() {
        input.value = "";
        output.textContent = "";
        output.style.display = "none";
        error.textContent = "";
    }
</script>

</body>
</html>
